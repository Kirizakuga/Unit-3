<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <!-- Unit-3 asks for "Share Tech Mono"; the Arch package ships it as ShureTechMono Nerd Font -->
 <alias binding="same">
  <family>Share Tech Mono</family>
  <prefer><family>ShureTechMono Nerd Font Mono</family><family>ShureTechMono Nerd Font</family></prefer>
 </alias>
 <!-- Unit-3 asks for "Noto Sans JP"; the installed Japanese Noto is Noto Sans CJK JP -->
 <alias binding="same">
  <family>Noto Sans JP</family>
  <prefer><family>Noto Sans CJK JP</family></prefer>
 </alias>
</fontconfig>
